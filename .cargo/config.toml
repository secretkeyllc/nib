# The packaged host-core child must start on a clean Windows installation.
# Statically link the MSVC CRT so the NSIS package does not require a separate
# Visual C++ Redistributable installation before the local service can boot.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Same contract for the arm64 (llvm-mingw) sidecar. Without this it links
# libunwind.dll dynamically — a DLL Windows does not ship and the installer does
# not bundle — so the app starts but the local service exits immediately.
[target.aarch64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

# Same contract for the native Windows ARM64 build (MSVC). Without this the
# sidecar imports VCRUNTIME140.dll, which is only present when the Visual C++
# Redistributable happens to be installed.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
